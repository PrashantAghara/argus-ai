version: "3.8"

services:
  otel-demo:
    image: ghcr.io/open-telemetry/demo:latest
    container_name: argus-otel-demo
    ports:
      - "8080:8080"
    environment:
      - OTEL_COLLECTOR_HOST=otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: argus-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:latest
    container_name: argus-prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest
    container_name: argus-loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:latest
    container_name: argus-tempo
    ports:
      - "3200:3200"
      - "4319:4317"
  grafana:
    image: grafana/grafana:latest
    container_name: argus-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
    depends_on:
      - prometheus
      - loki
      - tempo

  postgres:
    image: pgvector/pgvector:pg16
    container_name: argus-postgres
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
      ]
    environment:
      - POSTGRES_USER=argus
      - POSTGRES_PASSWORD=argus
      - POSTGRES_DB=argus
    ports:
      - "5432:5432"
    volumes:
      - argus-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  node-exporter:
    image: prom/node-exporter:latest
    container_name: argus-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: argus-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"

volumes:
  argus-postgres-data:
